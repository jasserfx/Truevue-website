<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — TrueVue Studio</title>
  <meta name="description" content="Get in touch with TrueVue Studio. Based in Sousse, Tunisia.">
  <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/1F6qazQYGRjPtAotPG7sIPEV7GcKzMQvG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;0,600;0,800;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/nav-footer.css">
  <style>
    .contact-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:120px 24px 80px; position:relative; overflow:hidden; background:linear-gradient(160deg,#0d0f1a 0%,#131620 55%,#0e1615 100%); }
    .contact-wrap::before { content:''; position:absolute; inset:0; background-image:linear-gradient(rgba(88,99,248,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(88,99,248,0.04) 1px,transparent 1px); background-size:72px 72px; mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 0%,transparent 75%); -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 0%,transparent 75%); }
    .contact-orb { position:absolute; border-radius:50%; pointer-events:none; }
    .contact-orb-1 { width:560px; height:560px; background:radial-gradient(circle,rgba(88,99,248,0.11) 0%,transparent 70%); top:-120px; left:-100px; }
    .contact-orb-2 { width:400px; height:400px; background:radial-gradient(circle,rgba(88,99,248,0.08) 0%,transparent 70%); bottom:-80px; right:-80px; }
    .contact-card { position:relative; z-index:2; width:100%; max-width:640px; text-align:center; }
    .contact-card .section-label { margin-bottom:16px; }
    .contact-card h1 { font-size:clamp(36px,5vw,58px); font-weight:600; line-height:1.1; margin-bottom:20px; }
    .contact-card h1 em { font-style:italic; color:var(--main); }
    .contact-card .subtitle { font-size:16px; font-weight:300; color:rgba(255,255,255,0.5); line-height:1.75; max-width:480px; margin:0 auto 56px; }
    .contact-info { display:flex; flex-direction:column; gap:16px; margin-bottom:52px; text-align:left; }
    .contact-row { display:flex; align-items:center; gap:18px; padding:18px 24px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:14px; transition:background 0.2s,border-color 0.2s; text-decoration:none; color:inherit; }
    a.contact-row:hover { background:rgba(88,99,248,0.07); border-color:rgba(88,99,248,0.2); }
    .contact-row-icon { width:44px; height:44px; border-radius:12px; background:rgba(88,99,248,0.12); border:1px solid rgba(88,99,248,0.18); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--main); flex-shrink:0; }
    .contact-row-body { flex:1; min-width:0; }
    .contact-row-label { font-size:10px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:4px; }
    .contact-row-value { font-size:14px; font-weight:400; color:rgba(255,255,255,0.85); }
    .contact-row-arrow { font-size:12px; color:rgba(255,255,255,0.2); transition:transform 0.2s,color 0.2s; }
    a.contact-row:hover .contact-row-arrow { color:var(--main); transform:translateX(3px); }
    .contact-divider { display:flex; align-items:center; gap:16px; margin-bottom:32px; color:rgba(255,255,255,0.15); font-size:11px; letter-spacing:0.15em; text-transform:uppercase; }
    .contact-divider::before,.contact-divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.07); }
    .contact-socials { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
    .social-btn { display:inline-flex; align-items:center; gap:10px; padding:12px 22px; border-radius:100px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.6); font-size:13px; font-weight:400; font-family:'Poppins',sans-serif; text-decoration:none; transition:all 0.25s; }
    .social-btn i { font-size:15px; }
    .social-btn:hover { color:var(--white); border-color:rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); transform:translateY(-2px); }
    .social-btn.instagram:hover { border-color:#e1306c; color:#e1306c; background:rgba(225,48,108,0.07); }
    .social-btn.linkedin:hover  { border-color:#0a66c2; color:#0a66c2; background:rgba(10,102,194,0.07); }
    .social-btn.facebook:hover  { border-color:#1877f2; color:#1877f2; background:rgba(24,119,242,0.07); }
    .social-btn.tiktok:hover    { border-color:#ff0050; color:#ff0050; background:rgba(255,0,80,0.07); }
    @media(max-width:600px){ .contact-row{padding:14px 18px;gap:14px;} .contact-socials{gap:8px;} .social-btn{padding:10px 16px;font-size:12px;} }
  </style>
</head>
<body>
<div id="nav-slot"></div>

<div class="contact-wrap">
  <div class="contact-orb contact-orb-1"></div>
  <div class="contact-orb contact-orb-2"></div>
  <div class="contact-card reveal">
    <span class="section-label" data-i18n="contact.label"></span>
    <h1 data-i18n="contact.title"></h1>
    <p class="subtitle" data-i18n="contact.subtitle"></p>

    <div class="contact-info">
      <div class="contact-row">
        <div class="contact-row-icon"><i class="fa-solid fa-location-dot"></i></div>
        <div class="contact-row-body">
          <div class="contact-row-label" data-i18n="contact.loc.label"></div>
          <div class="contact-row-value" data-i18n="contact.loc.value"></div>
        </div>
      </div>
      <a class="contact-row" href="mailto:Contact@truevuestudio.com">
        <div class="contact-row-icon"><i class="fa-solid fa-envelope"></i></div>
        <div class="contact-row-body">
          <div class="contact-row-label" data-i18n="contact.email.label"></div>
          <div class="contact-row-value">Contact@truevuestudio.com</div>
        </div>
        <i class="fa-solid fa-arrow-right contact-row-arrow"></i>
      </a>
      <a class="contact-row" href="tel:+21694644226">
        <div class="contact-row-icon"><i class="fa-solid fa-phone"></i></div>
        <div class="contact-row-body">
          <div class="contact-row-label" data-i18n="contact.phone.label"></div>
          <div class="contact-row-value">+216 94 644 226</div>
        </div>
        <i class="fa-solid fa-arrow-right contact-row-arrow"></i>
      </a>
    </div>

    <div class="contact-divider" data-i18n="contact.follow"></div>

    <div class="contact-socials">
      <a class="social-btn instagram" href="https://www.instagram.com/truevuestudio/" target="_blank" rel="noopener">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>
      <a class="social-btn linkedin" href="https://www.linkedin.com/company/truevue-studio/" target="_blank" rel="noopener">
        <i class="fa-brands fa-linkedin-in"></i> LinkedIn
      </a>
      <a class="social-btn facebook" href="https://www.facebook.com/TrueVueStudio" target="_blank" rel="noopener">
        <i class="fa-brands fa-facebook-f"></i> Facebook
      </a>
      <a class="social-btn tiktok" href="https://www.tiktok.com/@truevuestudio" target="_blank" rel="noopener">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </a>
    </div>
  </div>
</div>

<div id="footer-slot"></div>
<script src="js/components.js"></script>
</body>
</html>
