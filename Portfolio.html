<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — TrueVue Studio</title>
  <meta name="description" content="Browse TrueVue Studio's portfolio of cinematic photography and video work.">
  <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/1F6qazQYGRjPtAotPG7sIPEV7GcKzMQvG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;0,600;0,800;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/nav-footer.css">
  <style>

    /* ── PAGE HERO ─────────────────────────────────── */
    .port-hero {
      position: relative;
      padding: 160px 60px 72px;
      overflow: hidden;
      background: linear-gradient(180deg,#0d0f1a 0%,#171d1c 100%);
      text-align: center;
    }
    .port-hero-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(88,99,248,0.04) 1px, transparent 1px),
        linear-gradient(90deg,rgba(88,99,248,0.04) 1px,transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 80%);
    }
    .port-hero-orb {
      position: absolute;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle,rgba(88,99,248,0.13) 0%,transparent 70%);
      left: 50%; top: -120px; transform: translateX(-50%);
    }
    .port-hero-content { position: relative; z-index: 2; }
    .port-hero-content .section-title { margin-bottom: 12px; }
    .port-hero-content p {
      font-size: 17px; font-weight: 300;
      color: rgba(255,255,255,0.55);
      max-width: 520px; margin: 0 auto; line-height: 1.7;
    }

    /* ── CATEGORY TABS ──────────────────────────────── */
    .cat-tabs-wrap {
      background: var(--black);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 72px;
      z-index: 100;
    }
    .cat-tabs {
      display: flex;
      align-items: center;
      gap: 0;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      flex-shrink: 0;
      padding: 20px 22px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      cursor: pointer;
      border: none;
      background: none;
      font-family: 'Poppins', sans-serif;
      position: relative;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .cat-tab::after {
      content: '';
      position: absolute;
      bottom: 0; left: 16px; right: 16px;
      height: 2px;
      background: var(--main);
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .cat-tab:hover { color: rgba(255,255,255,0.7); }
    .cat-tab.active { color: var(--white); }
    .cat-tab.active::after { transform: scaleX(1); }

    /* ── PORTFOLIO SECTION ──────────────────────────── */
    .port-section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 48px 40px 80px;
    }

    /* ── MASONRY GRID (like reference) ──────────────── */
    .port-grid {
      columns: 3;
      column-gap: 10px;
    }
    @media (max-width: 1024px) { .port-grid { columns: 2; } }
    @media (max-width: 600px)  { .port-grid { columns: 1; } }

    .port-item {
      break-inside: avoid;
      margin-bottom: 10px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: #1a1f1e;
      display: block;
    }
    .port-item img,
    .port-item video {
      width: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .port-item:hover img,
    .port-item:hover video {
      transform: scale(1.04);
    }

    /* subtle dark gradient at bottom only on hover */
    .port-item-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 45%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .port-item:hover .port-item-overlay { opacity: 1; }

    /* title appears bottom-left on hover */
    .port-item-label {
      position: absolute;
      bottom: 14px; left: 16px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 2;
    }
    .port-item:hover .port-item-label {
      opacity: 1;
      transform: translateY(0);
    }

    /* video play badge */
    .port-play-badge {
      position: absolute;
      top: 12px; right: 12px;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 11px;
      pointer-events: none;
      z-index: 2;
    }

    /* ── EMPTY STATE ────────────────────────────────── */
    .port-empty {
      text-align: center;
      padding: 100px 40px;
      color: rgba(255,255,255,0.2);
    }
    .port-empty i { font-size: 52px; display: block; margin-bottom: 20px; }
    .port-empty p { font-size: 15px; }

    /* ── SKELETON ───────────────────────────────────── */
    .skel {
      border-radius: 10px;
      margin-bottom: 10px;
      background: linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }

    /* ── LIGHTBOX ───────────────────────────────────── */
    .lb {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.94);
      backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s;
    }
    .lb.open { opacity: 1; pointer-events: all; }
    .lb-wrap {
      position: relative;
      max-width: min(88vw, 1100px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lb-media {
      max-width: 100%;
      max-height: 82vh;
      border-radius: 10px;
      object-fit: contain;
      display: block;
    }
    .lb-info {
      margin-top: 18px;
      text-align: center;
    }
    .lb-title { font-size: 15px; font-weight: 500; }
    .lb-cat   { font-size: 11px; color: var(--main); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }

    .lb-close {
      position: fixed; top: 24px; right: 28px;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .lb-close:hover { background: rgba(255,255,255,0.14); transform: rotate(90deg); }
    .lb-arrow {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .lb-arrow:hover { background: rgba(88,99,248,0.35); border-color: var(--main); }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }

    /* ── MOBILE ─────────────────────────────────────── */
    @media (max-width: 900px) {
      .port-hero { padding: 130px 24px 56px; }
      .port-section { padding: 36px 16px 60px; }
      .cat-tabs { padding: 0 16px; gap: 0; }
      .cat-tab  { padding: 16px 14px; font-size: 11px; }
    }
  </style>
</head>
<body>

<div id="nav-slot"></div>

<!-- HERO -->
<section class="port-hero">
  <div class="port-hero-grid"></div>
  <div class="port-hero-orb"></div>
  <div class="port-hero-content reveal">
    <span class="section-label">Portfolio</span>
    <h1 class="section-title">Our <em>Work</em></h1>
    <p>A curated look at the cinematic visuals we've crafted for brands, products, and stories that demand to be seen.</p>
  </div>
</section>

<!-- CATEGORY TABS -->
<div class="cat-tabs-wrap">
  <div class="cat-tabs" id="catTabs">
    <!-- injected by JS -->
  </div>
</div>

<!-- GRID -->
<section class="port-section">
  <div class="port-grid" id="portGrid"></div>
  <div class="port-empty" id="portEmpty" style="display:none">
    <i class="fa-regular fa-folder-open"></i>
    <p>No media in this category yet.</p>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <button class="lb-close" id="lbClose"><i class="fa-solid fa-xmark"></i></button>
  <button class="lb-arrow lb-prev" id="lbPrev"><i class="fa-solid fa-chevron-left"></i></button>
  <button class="lb-arrow lb-next" id="lbNext"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="lb-wrap">
    <img  class="lb-media" id="lbImg" src="" alt="" style="display:none">
    <video class="lb-media" id="lbVid" controls style="display:none"></video>
    <div class="lb-info">
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-cat"   id="lbCat"></div>
    </div>
  </div>
</div>

<div id="footer-slot"></div>
<script src="js/components.js"></script>
<script>
(function () {
  const API = 'https://truevue-backend.onrender.com';

  /* ── State ── */
  let categories = [];
  let allMedia   = [];
  let activeCat  = 'all';
  let lbItems    = [];
  let lbIdx      = 0;

  /* ── Elements ── */
  const catTabs  = document.getElementById('catTabs');
  const portGrid = document.getElementById('portGrid');
  const portEmpty= document.getElementById('portEmpty');
  const lb       = document.getElementById('lb');
  const lbImg    = document.getElementById('lbImg');
  const lbVid    = document.getElementById('lbVid');
  const lbTitle  = document.getElementById('lbTitle');
  const lbCat    = document.getElementById('lbCat');

  /* ── Load ── */
  async function load() {
    showSkeleton();
    try {
      const [cr, mr] = await Promise.all([
        fetch(`${API}/api/portfolio/categories`),
        fetch(`${API}/api/portfolio/media`)
      ]);
      categories = cr.ok ? await cr.json() : [];
      allMedia   = mr.ok ? await mr.json() : [];
    } catch {
      categories = demoCategories();
      allMedia   = demoMedia();
    }
    buildTabs();
    renderGrid();
  }

  /* ── Tabs ── */
  function buildTabs() {
    const allCount = allMedia.length;
    let html = `<button class="cat-tab active" data-cat="all">All Work <span style="opacity:.4;font-weight:300;margin-left:4px">(${allCount})</span></button>`;
    categories.forEach(c => {
      const n = allMedia.filter(m => m.category_id === c.id).length;
      html += `<button class="cat-tab" data-cat="${c.id}">${esc(c.name)} <span style="opacity:.4;font-weight:300;margin-left:4px">(${n})</span></button>`;
    });
    catTabs.innerHTML = html;
    catTabs.querySelectorAll('.cat-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCat = btn.dataset.cat;
        catTabs.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
      });
    });
  }

  /* ── Grid ── */
  function filtered() {
    return activeCat === 'all' ? allMedia : allMedia.filter(m => m.category_id === activeCat);
  }

  function renderGrid() {
    const items = filtered();
    lbItems = items;

    if (!items.length) {
      portGrid.innerHTML = '';
      portEmpty.style.display = 'block';
      return;
    }
    portEmpty.style.display = 'none';

    portGrid.innerHTML = items.map((m, i) => {
      const cat = categories.find(c => c.id === m.category_id);
      const isVid = m.type === 'video';
      const src   = mediaUrl(m.url);

      const media = isVid
        ? `<video src="${src}" muted loop preload="metadata" style="width:100%;display:block;object-fit:cover;max-height:420px"></video>
           <div class="port-play-badge"><i class="fa-solid fa-play" style="margin-left:2px;font-size:10px"></i></div>`
        : `<img src="${src}" alt="${esc(m.title)}" loading="lazy">`;

      return `<div class="port-item" data-idx="${i}">
        ${media}
        <div class="port-item-overlay"></div>
        <div class="port-item-label">${esc(m.title)}${cat ? ` <span style="opacity:.55">· ${esc(cat.name)}</span>` : ''}</div>
      </div>`;
    }).join('');

    portGrid.querySelectorAll('.port-item').forEach(el => {
      el.addEventListener('click', () => openLb(+el.dataset.idx));
      const v = el.querySelector('video');
      if (v) {
        el.addEventListener('mouseenter', () => v.play().catch(()=>{}));
        el.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
      }
    });

    // reveal
    setTimeout(() => portGrid.querySelectorAll('.port-item').forEach(e => e.classList.add('visible')), 50);
  }

  /* ── Lightbox ── */
  function openLb(idx) {
    lbIdx = idx;
    showLb();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function showLb() {
    const m = lbItems[lbIdx];
    if (!m) return;
    const isVid = m.type === 'video';
    const cat   = categories.find(c => c.id === m.category_id);
    lbImg.style.display = isVid ? 'none' : 'block';
    lbVid.style.display = isVid ? 'block' : 'none';
    if (isVid) { lbVid.src = mediaUrl(m.url); lbVid.load(); }
    else        { lbImg.src = mediaUrl(m.url); lbImg.alt = m.title; }
    lbTitle.textContent = m.title;
    lbCat.textContent   = cat ? cat.name : '';
  }
  function closeLb() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    lbVid.pause(); lbVid.src = ''; lbImg.src = '';
  }
  document.getElementById('lbClose').onclick = closeLb;
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.getElementById('lbPrev').onclick = () => { lbIdx = (lbIdx - 1 + lbItems.length) % lbItems.length; showLb(); };
  document.getElementById('lbNext').onclick = () => { lbIdx = (lbIdx + 1) % lbItems.length; showLb(); };
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')      closeLb();
    if (e.key === 'ArrowLeft')  { lbIdx = (lbIdx - 1 + lbItems.length) % lbItems.length; showLb(); }
    if (e.key === 'ArrowRight') { lbIdx = (lbIdx + 1) % lbItems.length; showLb(); }
  });

  /* ── Skeleton ── */
  function showSkeleton() {
    const heights = [280,220,340,200,300,260,310,230,280];
    portGrid.innerHTML = heights.map(h => `<div class="skel" style="height:${h}px"></div>`).join('');
  }

  /* ── Helpers ── */
  function mediaUrl(u) {
    if (!u) return '';
    return u.startsWith('http') ? u : `${API}${u}`;
  }
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Demo data (no API) ── */
  function demoCategories() {
    return [
      { id:'product-photo',  name:'Product Photography' },
      { id:'product-video',  name:'Product Videography' },
      { id:'brand-film',     name:'Brand Films' },
      { id:'commercial',     name:'Commercial' },
      { id:'events',         name:'Events' },
      { id:'real-estate',    name:'Real Estate' },
      { id:'lifestyle',      name:'Lifestyle' },
      { id:'social-content', name:'Social Content' },
    ];
  }
  function demoMedia() {
    const cats = demoCategories();
    const titles = [
      'Product Campaign','Brand Story Film','Commercial Shoot','Event Coverage',
      'Lifestyle Session','Real Estate Tour','Social Reel','Product Detail',
      'Corporate Film','Launch Campaign','Hospitality Shoot','Fitness Campaign'
    ];
    // gradient placeholder squares of varying ratios
    const colors = [
      ['#1e1e3a','#2a2a50'],['#1a2a2a','#0f1f1f'],['#2a1e3a','#1a0f2a'],
      ['#1e2a1e','#0f1a0f'],['#3a1e1e','#2a0f0f'],['#1e3a3a','#0f2a2a'],
      ['#2d1e3a','#1a0f2a'],['#1e3a2a','#0f2a1a'],['#3a2a1e','#2a1a0f'],
      ['#1a1a3a','#0f0f2a'],['#3a1e2a','#2a0f1a'],['#1e3a1e','#0f2a0f'],
    ];
    const ratios = [1.2,0.75,1.5,1,0.8,1.3,1.1,0.9,1.4,1.0,0.7,1.2];
    return titles.map((t,i) => ({
      id: `demo-${i}`,
      title: t,
      type: i===1||i===2||i===9 ? 'video' : 'photo',
      category_id: cats[i % cats.length].id,
      url: `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='${Math.round(800*ratios[i])}'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${colors[i][0]}'/><stop offset='1' stop-color='${colors[i][1]}'/></linearGradient></defs><rect width='100%25' height='100%25' fill='url(%23g)'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='rgba(255,255,255,0.1)' font-size='13' font-family='sans-serif'>TrueVue Studio</text></svg>`,
    }));
  }

  load();
})();
</script>
</body>
</html>
