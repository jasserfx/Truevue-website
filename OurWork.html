<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Work — TrueVue Studio</title>
  <meta name="description" content="Browse TrueVue Studio's portfolio of cinematic photography and video work.">
  <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/1F6qazQYGRjPtAotPG7sIPEV7GcKzMQvG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;0,600;0,800;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/nav-footer.css">
  <style>

    /* ── PAGE HERO ─────────────────────────────── */
    .work-hero {
      position: relative;
      padding: 160px 60px 80px;
      overflow: hidden;
      background: linear-gradient(180deg, #0d0f1a 0%, #171d1c 100%);
    }
    .work-hero-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(88,99,248,0.04) 1px, transparent 1px),
        linear-gradient(90deg,rgba(88,99,248,0.04) 1px,transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 80%);
    }
    .work-hero-orb {
      position: absolute;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle,rgba(88,99,248,0.14) 0%,transparent 70%);
      left: 50%; top: -100px; transform: translateX(-50%);
    }
    .work-hero-content {
      position: relative; z-index: 2;
      max-width: 800px;
    }

    /* ── LAYOUT ────────────────────────────────── */
    .work-layout {
      display: flex;
      gap: 0;
      min-height: 80vh;
      background: var(--black);
    }

    /* ── SIDEBAR ───────────────────────────────── */
    .work-sidebar {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.06);
      padding: 40px 0;
      position: sticky;
      top: 72px;
      height: calc(100vh - 72px);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .work-sidebar::-webkit-scrollbar { display: none; }

    .sidebar-section-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      padding: 0 28px;
      margin-bottom: 12px;
    }

    .category-list { list-style: none; padding: 0 12px; }
    .category-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 400;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: 'Poppins', sans-serif;
    }
    .category-item:hover {
      color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.04);
    }
    .category-item.active {
      color: var(--main);
      background: rgba(88,99,248,0.12);
      font-weight: 500;
    }
    .category-item i { width: 16px; text-align: center; font-size: 13px; }
    .category-count {
      margin-left: auto;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 100px;
    }
    .category-item.active .category-count {
      color: var(--main);
      background: rgba(88,99,248,0.15);
    }

    .sidebar-divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 20px 28px;
    }

    /* Type filter (Photo / Video / All) */
    .type-filter-list { list-style: none; padding: 0 12px; margin-bottom: 8px; }
    .type-filter-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px; border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
      color: rgba(255,255,255,0.45);
      font-size: 12px; font-weight: 400;
      border: none; background: none; width: 100%;
      text-align: left; font-family: 'Poppins', sans-serif;
    }
    .type-filter-item:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.03); }
    .type-filter-item.active { color: var(--white); }
    .type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .type-dot.all    { background: var(--main); }
    .type-dot.photo  { background: #58c8f8; }
    .type-dot.video  { background: #f8a858; }

    /* ── CONTENT AREA ───────────────────────────── */
    .work-content {
      flex: 1;
      padding: 40px 48px;
      min-width: 0;
    }

    .work-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .work-breadcrumb {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
    }
    .work-breadcrumb span { color: var(--white); }
    .work-count {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.05em;
    }

    /* ── MASONRY GRID ───────────────────────────── */
    .work-grid {
      columns: 3;
      column-gap: 16px;
    }
    @media (max-width: 1100px) { .work-grid { columns: 2; } }
    @media (max-width: 700px)  { .work-grid { columns: 1; } }

    .work-item {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: var(--gray-dark);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s;
    }
    .work-item:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
      z-index: 2;
    }
    .work-item img,
    .work-item video {
      width: 100%;
      display: block;
      object-fit: cover;
    }
    .work-item video { max-height: 400px; }

    /* Overlay on hover */
    .work-item-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }
    .work-item:hover .work-item-overlay { opacity: 1; }
    .work-item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--white);
      margin-bottom: 4px;
    }
    .work-item-meta {
      display: flex; align-items: center; gap: 8px;
    }
    .work-item-cat {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--main);
    }
    .work-item-type-badge {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 100px;
      font-weight: 500;
    }
    .work-item-type-badge.photo { background: rgba(88,200,248,0.2); color: #58c8f8; }
    .work-item-type-badge.video { background: rgba(248,168,88,0.2); color: #f8a858; }

    /* Play icon overlay for videos */
    .video-play-icon {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px;
      pointer-events: none;
      transition: all 0.3s;
    }
    .work-item:hover .video-play-icon {
      background: rgba(88,99,248,0.6);
      border-color: var(--main);
      transform: translate(-50%,-50%) scale(1.08);
    }

    /* ── EMPTY STATE ────────────────────────────── */
    .work-empty {
      text-align: center;
      padding: 80px 40px;
      color: rgba(255,255,255,0.25);
    }
    .work-empty i { font-size: 48px; margin-bottom: 20px; display: block; }
    .work-empty p { font-size: 15px; }

    /* ── LOADING SKELETON ───────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 14px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── LIGHTBOX ───────────────────────────────── */
    .lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }
    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lightbox-media {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      object-fit: contain;
      display: block;
    }
    .lightbox-info {
      margin-top: 20px;
      text-align: center;
    }
    .lightbox-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .lightbox-sub { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; text-transform: uppercase; }
    .lightbox-close {
      position: fixed; top: 28px; right: 36px;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: white; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.15); transform: rotate(90deg); }
    .lightbox-nav {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: white; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .lightbox-nav:hover { background: rgba(88,99,248,0.3); border-color: var(--main); }
    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }

    /* ── MOBILE ─────────────────────────────────── */
    @media (max-width: 900px) {
      .work-hero { padding: 140px 24px 60px; }
      .work-layout { flex-direction: column; }
      .work-sidebar {
        width: 100%; height: auto; position: static;
        border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06);
        padding: 24px 0;
        display: flex; gap: 0; overflow-x: auto; flex-direction: column;
      }
      .work-content { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<div id="nav-slot"></div>

<!-- ── PAGE HERO ───────────────────────────────────── -->
<section class="work-hero">
  <div class="work-hero-grid"></div>
  <div class="work-hero-orb"></div>
  <div class="work-hero-content reveal">
    <span class="section-label">Portfolio</span>
    <h1 class="section-title">Our <em>Work</em></h1>
    <p style="font-size:17px;font-weight:300;color:rgba(255,255,255,0.6);max-width:560px;line-height:1.7;">
      A curated selection of the cinematic visuals we've crafted — browse by category or explore everything.
    </p>
  </div>
</section>

<!-- ── MAIN LAYOUT ─────────────────────────────────── -->
<div class="work-layout">

  <!-- Sidebar -->
  <aside class="work-sidebar" id="workSidebar">

    <p class="sidebar-section-label">Type</p>
    <ul class="type-filter-list">
      <li><button class="type-filter-item active" data-type="all">
        <span class="type-dot all"></span> All Media
      </button></li>
      <li><button class="type-filter-item" data-type="photo">
        <span class="type-dot photo"></span> Photos
      </button></li>
      <li><button class="type-filter-item" data-type="video">
        <span class="type-dot video"></span> Videos
      </button></li>
    </ul>

    <div class="sidebar-divider"></div>

    <p class="sidebar-section-label">Categories</p>
    <ul class="category-list" id="categoryList">
      <!-- populated by JS -->
    </ul>
  </aside>

  <!-- Content -->
  <main class="work-content">
    <div class="work-toolbar">
      <div class="work-breadcrumb">All Work → <span id="activeCatLabel">Everything</span></div>
      <div class="work-count" id="mediaCount"></div>
    </div>
    <div class="work-grid" id="workGrid">
      <!-- populated by JS -->
    </div>
    <div class="work-empty" id="workEmpty" style="display:none">
      <i class="fa-regular fa-folder-open"></i>
      <p>No media in this category yet.</p>
    </div>
  </main>
</div>

<!-- ── LIGHTBOX ─────────────────────────────────────── -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="lightbox-inner">
    <img class="lightbox-media" id="lightboxImg" src="" alt="" style="display:none">
    <video class="lightbox-media" id="lightboxVid" controls style="display:none"></video>
    <div class="lightbox-info">
      <div class="lightbox-title" id="lightboxTitle"></div>
      <div class="lightbox-sub" id="lightboxSub"></div>
    </div>
  </div>
</div>

<div id="footer-slot"></div>
<script src="js/components.js"></script>
<script>
(function () {
  /* ── Config ───────────────────────────────────────── */
  const API = 'https://truevue-backend.onrender.com';

  /* ── State ────────────────────────────────────────── */
  let allCategories = [];
  let allMedia      = [];
  let activeCat     = 'all';  // category id or 'all'
  let activeType    = 'all';  // 'all' | 'photo' | 'video'
  let lightboxItems = [];
  let lightboxIndex = 0;

  /* ── Elements ─────────────────────────────────────── */
  const categoryList   = document.getElementById('categoryList');
  const workGrid       = document.getElementById('workGrid');
  const workEmpty      = document.getElementById('workEmpty');
  const mediaCount     = document.getElementById('mediaCount');
  const activeCatLabel = document.getElementById('activeCatLabel');
  const lightbox       = document.getElementById('lightbox');
  const lightboxImg    = document.getElementById('lightboxImg');
  const lightboxVid    = document.getElementById('lightboxVid');
  const lightboxTitle  = document.getElementById('lightboxTitle');
  const lightboxSub    = document.getElementById('lightboxSub');

  /* ── Fetch ─────────────────────────────────────────── */
  async function loadData() {
    showSkeletons();
    try {
      const [catRes, mediaRes] = await Promise.all([
        fetch(`${API}/api/portfolio/categories`),
        fetch(`${API}/api/portfolio/media`)
      ]);
      allCategories = catRes.ok  ? await catRes.json()  : [];
      allMedia      = mediaRes.ok ? await mediaRes.json() : [];
    } catch (e) {
      console.warn('Portfolio API not reachable, using demo data', e);
      allCategories = getDemoCategories();
      allMedia      = getDemoMedia();
    }
    renderSidebar();
    renderGrid();
  }

  /* ── Sidebar ────────────────────────────────────────── */
  function renderSidebar() {
    // "All" item
    const allCount = allMedia.length;
    let html = `<li>
      <button class="category-item${activeCat==='all'?' active':''}" data-cat="all">
        <i class="fa-solid fa-grip"></i> All Projects
        <span class="category-count">${allCount}</span>
      </button>
    </li>`;

    allCategories.forEach(cat => {
      const count = allMedia.filter(m => m.category_id === cat.id).length;
      html += `<li>
        <button class="category-item${activeCat===cat.id?' active':''}" data-cat="${cat.id}">
          <i class="${cat.icon || 'fa-solid fa-folder'}"></i>
          ${escHtml(cat.name)}
          <span class="category-count">${count}</span>
        </button>
      </li>`;
    });
    categoryList.innerHTML = html;

    categoryList.querySelectorAll('.category-item').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCat = btn.dataset.cat;
        categoryList.querySelectorAll('.category-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = allCategories.find(c => c.id === activeCat);
        activeCatLabel.textContent = activeCat === 'all' ? 'Everything' : (cat?.name || '');
        renderGrid();
      });
    });
  }

  /* ── Type filter ────────────────────────────────────── */
  document.querySelectorAll('.type-filter-item').forEach(btn => {
    btn.addEventListener('click', () => {
      activeType = btn.dataset.type;
      document.querySelectorAll('.type-filter-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    });
  });

  /* ── Grid ───────────────────────────────────────────── */
  function getFiltered() {
    return allMedia.filter(m => {
      const catMatch  = activeCat === 'all' || m.category_id === activeCat;
      const typeMatch = activeType === 'all' || m.type === activeType;
      return catMatch && typeMatch;
    });
  }

  function renderGrid() {
    const items = getFiltered();
    lightboxItems = items;

    mediaCount.textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;

    if (!items.length) {
      workGrid.innerHTML = '';
      workEmpty.style.display = 'block';
      return;
    }
    workEmpty.style.display = 'none';

    workGrid.innerHTML = items.map((m, i) => {
      const cat = allCategories.find(c => c.id === m.category_id);
      const isVideo = m.type === 'video';
      const mediaEl = isVideo
        ? `<video src="${mediaUrl(m.url)}" muted loop preload="metadata" style="width:100%;display:block;max-height:400px;object-fit:cover;"></video>
           <div class="video-play-icon"><i class="fa-solid fa-play" style="margin-left:3px"></i></div>`
        : `<img src="${mediaUrl(m.url)}" alt="${escHtml(m.title)}" loading="lazy">`;

      return `<div class="work-item reveal reveal-delay-${(i%3)+1}" data-index="${i}" title="${escHtml(m.title)}">
        ${mediaEl}
        <div class="work-item-overlay">
          <div class="work-item-title">${escHtml(m.title)}</div>
          <div class="work-item-meta">
            ${cat ? `<span class="work-item-cat">${escHtml(cat.name)}</span>` : ''}
            <span class="work-item-type-badge ${m.type}">${m.type}</span>
          </div>
        </div>
      </div>`;
    }).join('');

    // Attach click for lightbox
    workGrid.querySelectorAll('.work-item').forEach(el => {
      el.addEventListener('click', () => openLightbox(parseInt(el.dataset.index)));
      // Hover-play videos
      const vid = el.querySelector('video');
      if (vid) {
        el.addEventListener('mouseenter', () => vid.play().catch(()=>{}));
        el.addEventListener('mouseleave', () => { vid.pause(); vid.currentTime = 0; });
      }
    });

    // Trigger reveal
    setTimeout(() => {
      workGrid.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    }, 60);
  }

  /* ── Lightbox ──────────────────────────────────────── */
  function openLightbox(index) {
    lightboxIndex = index;
    showLightboxItem();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLightboxItem() {
    const m = lightboxItems[lightboxIndex];
    if (!m) return;
    const isVideo = m.type === 'video';
    const cat = allCategories.find(c => c.id === m.category_id);

    lightboxImg.style.display = isVideo ? 'none' : 'block';
    lightboxVid.style.display = isVideo ? 'block' : 'none';

    if (isVideo) {
      lightboxVid.src = mediaUrl(m.url);
      lightboxVid.load();
    } else {
      lightboxImg.src = mediaUrl(m.url);
      lightboxImg.alt = m.title;
    }
    lightboxTitle.textContent = m.title;
    lightboxSub.textContent   = [cat?.name, m.type].filter(Boolean).join(' · ').toUpperCase();
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    lightboxVid.pause();
    lightboxVid.src = '';
    lightboxImg.src = '';
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

  document.getElementById('lightboxPrev').addEventListener('click', () => {
    lightboxIndex = (lightboxIndex - 1 + lightboxItems.length) % lightboxItems.length;
    showLightboxItem();
  });
  document.getElementById('lightboxNext').addEventListener('click', () => {
    lightboxIndex = (lightboxIndex + 1) % lightboxItems.length;
    showLightboxItem();
  });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft')  { lightboxIndex = (lightboxIndex - 1 + lightboxItems.length) % lightboxItems.length; showLightboxItem(); }
    if (e.key === 'ArrowRight') { lightboxIndex = (lightboxIndex + 1) % lightboxItems.length; showLightboxItem(); }
  });

  /* ── Skeletons ─────────────────────────────────────── */
  function showSkeletons() {
    workGrid.innerHTML = Array.from({length:9}, (_,i) =>
      `<div class="skeleton" style="height:${[220,300,180,260,200,320,240,190,280][i]}px; margin-bottom:16px;"></div>`
    ).join('');
  }

  /* ── Helpers ───────────────────────────────────────── */
  function mediaUrl(url) {
    if (!url) return '';
    if (url.startsWith('http')) return url;
    return `${API}${url}`;
  }
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Demo data (shown when API unavailable) ─────────── */
  function getDemoCategories() {
    return [
      { id: 'brand',        name: 'Brand & Commercial',  icon: 'fa-solid fa-briefcase' },
      { id: 'events',       name: 'Events',              icon: 'fa-solid fa-calendar-star' },
      { id: 'real-estate',  name: 'Real Estate',         icon: 'fa-solid fa-building' },
